# Put this inside your server { } block, BEFORE any  location ~ \.php$  block.
# "^~" makes nginx pick this block for everything under /uploads/avatars/, so a .php name there can never reach PHP-FPM.
location ^~ /uploads/avatars/ {
    root /var/www/behavioralx/public;                 # the same root as the site: change to your real path
    autoindex off;
    default_type image/jpeg;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;   # file names are random and never reused
    if ($uri !~ "^/uploads/avatars/u[0-9]+_[0-9a-f]{16}\.jpg$") { return 404; }
    try_files $uri =404;
}
